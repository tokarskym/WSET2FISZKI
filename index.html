<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Słońce Quiz Win</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: żółte tło z promieniami, karta pytania na środku, pod nią panel z wyjaśnieniem, na dole przyklejony pasek postępu z RESET */
:root{
  --plum:#5F1E3B;
  --plum-deep:#47142B;
  --sun:#F8C932;
  --sun-soft:#FBDB6E;
  --rust:#8A3C2C;
  --paper:#FFF8E1;
  --ink:#3B1224;
  --ink-soft:#6E4A55;
  --ok:#2E6A3C;
  --ok-bg:#E3F0DA;
  --bad:#A8261F;
  --bad-bg:#FBE1D9;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --barH:74px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--sun);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--plum);outline-offset:3px}

.stage{position:relative;overflow:hidden;min-height:100vh;
  padding-block:28px calc(var(--barH) + 40px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rays{position:absolute;inset:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% 12%,var(--rust) 0deg .45deg,transparent .45deg 9deg);
  -webkit-mask:linear-gradient(#000 0%,rgba(0,0,0,.5) 40%,transparent 80%);mask:linear-gradient(#000 0%,rgba(0,0,0,.5) 40%,transparent 80%);opacity:.7}
.wrap{position:relative;max-width:720px;margin:0 auto;display:grid;gap:18px}

/* Przełącznik trybu */
.modes{justify-self:center;display:flex;gap:4px;padding:4px;background:var(--plum);border-radius:999px;flex-wrap:wrap;justify-content:center}
.mode{background:transparent;border:0;color:var(--paper);font-family:var(--mono);font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;padding:8px 14px;border-radius:999px}
.mode:hover{color:var(--sun)}
.mode[aria-pressed="true"]{background:var(--sun);color:var(--plum)}
.mode .n{font-weight:500;margin-left:4px}

.mode:disabled{opacity:.4;cursor:default}
.mode:disabled:hover{color:var(--paper)}
.h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0;color:var(--ink)}
.resume{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-block:18px}
.resume div{display:grid;gap:2px;min-width:0}
.resume small,.choice small{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust)}
.resume b{font-family:var(--display);font-weight:700;font-size:17px;color:var(--plum)}
.resume span{color:var(--ink-soft);font-size:14px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:640px){.choices{grid-template-columns:1fr}}
.choice{display:grid;gap:6px;align-content:start;text-align:left;text-decoration:none;color:var(--ink);background:#fff;
  border:2px solid rgba(138,60,44,.35);border-radius:16px;padding:16px;transition:transform .12s,border-color .12s;min-width:0}
.choice:hover:not(:disabled){border-color:var(--rust);transform:translateY(-2px)}
.choice:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
.choice b{font-family:var(--display);font-weight:700;font-size:17px;color:var(--plum);line-height:1.2}
.choice span{font-size:14px;color:var(--ink-soft)}
.choice:disabled{opacity:.5;cursor:default}
#start-all{background:var(--plum);border-color:var(--plum)}
#start-all b{color:var(--sun)} #start-all small{color:var(--sun-soft)} #start-all span{color:var(--paper)}
.hint-line{margin:14px 0 0;font-size:14px;color:var(--ink-soft)}
#wybor{scroll-margin-top:16px}
.pick-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.pick-tools{display:flex;gap:8px;flex-wrap:wrap}
.pick-group{margin-top:16px}
.pg-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:2px dotted rgba(138,60,44,.35);padding-bottom:6px;margin-bottom:8px}
.pg-head h3{margin:0;font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--rust)}
.link-btn{background:none;border:0;padding:0;font-size:13px;color:var(--plum);text-decoration:underline}
.pick-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.pick-list li{display:flex;align-items:center;gap:8px}
.pick{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fff;border:2px solid rgba(138,60,44,.2);border-radius:12px;cursor:pointer}
.pick:has(input:checked){border-color:var(--plum);background:#FFF1C2}
.pick input{flex:none;width:20px;height:20px;accent-color:var(--plum);margin:0}
.pk-txt{display:grid;min-width:0}
.pk-txt b{font-weight:600;line-height:1.3}
.pk-txt small{font-size:13px;color:var(--ink-soft);overflow-wrap:anywhere}
.only{flex:none;background:transparent;border:2px solid rgba(95,30,59,.35);color:var(--plum);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600}
.only:hover{border-color:var(--plum);background:rgba(95,30,59,.06)}
.pick-go{position:sticky;bottom:calc(var(--barH) + env(safe-area-inset-bottom,0px) + 10px);margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--paper);border:2px solid var(--rust);border-radius:14px;padding:10px 12px}
#pick-sum{font-family:var(--mono);font-size:13px;letter-spacing:.06em;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--paper);border:3px solid var(--rust);border-radius:22px;padding:26px clamp(18px,4vw,34px);box-shadow:0 10px 0 var(--rust)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.chip{background:var(--plum);color:var(--sun);padding:4px 10px;border-radius:999px}
.q{font-family:var(--display);font-weight:700;font-size:clamp(21px,3.6vw,30px);line-height:1.25;margin:16px 0 22px;text-wrap:balance}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.long{grid-template-columns:1fr}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;background:#fff;border:2px solid rgba(138,60,44,.35);
  border-radius:14px;padding:13px 14px;font-size:16px;font-weight:500;line-height:1.4;transition:transform .12s,border-color .12s;min-width:0}
.opts.long .opt{font-weight:400}
.opt:hover:not(:disabled){border-color:var(--rust);transform:translateY(-2px)}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:12px;
  background:var(--sun);color:var(--plum);border:1.5px solid var(--rust);margin-top:-1px}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.right .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.5}
.wait{margin:16px 0 0;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-soft);text-transform:uppercase}

/* Panel z wyjaśnieniem */
.fb{border-radius:22px;overflow:hidden;border:3px solid var(--rust);background:var(--paper);box-shadow:0 10px 0 var(--rust);animation:rise .28s ease-out}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.fb{animation:none}.opt,.fill{transition:none!important}}
.fb-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px clamp(18px,4vw,30px);color:#fff}
.fb.ok .fb-head{background:var(--ok)}
.fb.no .fb-head{background:var(--bad)}
.fb-head strong{font-family:var(--display);font-weight:700;font-size:18px}
.fb-body{padding:20px clamp(18px,4vw,30px) 22px;display:grid;gap:16px}
.answer-line{margin:0;font-weight:600}
.answer-line small{display:block;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust)}
.info{margin:0;max-width:64ch}
.wine-top{display:flex;align-items:baseline;gap:6px 10px;flex-wrap:wrap;margin:-26px calc(-1*clamp(18px,4vw,34px)) 18px;
  padding:12px clamp(18px,4vw,34px);background:var(--plum);color:var(--sun);border-radius:19px 19px 0 0}
.wine-top small{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--paper);opacity:.75}
.wine-top b{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.02em}
.wine-top span{font-family:var(--mono);font-size:12px;color:var(--paper)}
.wine-card{display:grid;gap:16px;padding:18px;background:#fff;border:2px solid rgba(138,60,44,.25);border-radius:16px}
.wc-head{border-bottom:2px dotted rgba(138,60,44,.35);padding-bottom:12px}
.wine-name{margin:0;font-family:var(--display);font-weight:700;font-size:17px;color:var(--plum);line-height:1.3;text-wrap:balance}
.wine-by{margin:4px 0 0;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink-soft)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 20px;margin:0}
.facts dd{font-weight:500!important;line-height:1.4}
.stories{display:grid;gap:12px}
.story{border-left:4px solid var(--sun);padding:2px 0 2px 12px}
.story h3{margin:0 0 2px;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust)}
.story p{margin:0;max-width:64ch}
.facts div{min-width:0}
.facts dt{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rust)}
.facts dd{margin:2px 0 0;font-weight:600}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.q-actions{margin-top:18px}
.q-actions:empty{display:none}
.btn{border:2px solid var(--plum);border-radius:999px;padding:10px 18px;font-weight:600;background:transparent;color:var(--plum)}
.btn:hover{background:rgba(95,30,59,.08)}
.btn.primary{background:var(--plum);color:var(--sun)}
.btn.primary:hover{background:var(--plum-deep)}
.btn.on{background:var(--sun);border-color:var(--rust);color:var(--ink)}
.small{font-size:14px;padding:7px 14px}

.big{font-family:var(--display);font-weight:800;font-size:clamp(48px,10vw,80px);line-height:1;color:var(--plum);margin:14px 0 6px;font-variant-numeric:tabular-nums}
.lead{font-size:17px;margin:0 0 18px;max-width:55ch}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:2px solid rgba(138,60,44,.25);border-radius:14px}
.list li > div{min-width:0}
.list small{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--rust)}
.empty{padding:18px;border:2px dashed rgba(138,60,44,.4);border-radius:14px;color:var(--ink-soft);margin:0}

/* Dolny pasek */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--plum);color:var(--paper);
  box-shadow:0 -4px 14px rgba(59,18,36,.25);padding-bottom:env(safe-area-inset-bottom,0px)}
.bottom-in{max-width:720px;margin:0 auto;min-height:var(--barH);display:flex;align-items:center;gap:16px;
  padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.track-box{flex:1;min-width:0;display:grid;gap:7px}
.track-meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.track-meta b{color:var(--sun);font-weight:500}
.track{height:10px;border-radius:999px;background:rgba(255,248,225,.18);overflow:hidden;display:flex}
.fill{height:100%;transition:width .3s}
.fill.ok{background:var(--sun)}
.fill.no{background:#E8836B}
.reset{flex:none;background:transparent;border:2px solid var(--sun);color:var(--sun);border-radius:999px;padding:9px 16px;
  font-family:var(--mono);font-size:13px;font-weight:500;letter-spacing:.16em}
.reset:hover{background:var(--sun);color:var(--plum)}
.confirm{flex:none;display:flex;gap:8px;align-items:center;font-size:14px}
.confirm .reset{padding:7px 12px;font-size:12px}
.confirm .reset.ghost{border-color:rgba(255,248,225,.5);color:var(--paper)}
@media (max-width:480px){.confirm span{display:none}}
</style>

<main class="stage">
  <div class="rays" aria-hidden="true"></div>
  <div class="wrap">
    <nav class="modes" aria-label="Widok">
      <button class="mode" id="m-home" data-view="home" aria-pressed="true">Start</button>
      <button class="mode" id="m-quiz" data-view="quiz" aria-pressed="false">Quiz</button>
      <button class="mode" id="m-list" data-view="list" aria-pressed="false">Trudne <span class="n" id="hard-count">0</span></button>
    </nav>
    <div id="app" style="display:grid;gap:18px"></div>
  </div>
</main>

<footer class="bottom">
  <div class="bottom-in">
    <div class="track-box">
      <div class="track-meta"><span id="pos">Pytanie 1 / 1</span><span>Dobrze <b id="score">0</b></span></div>
      <div class="track" role="progressbar" id="track" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <i class="fill ok" id="fill-ok" style="width:0"></i><i class="fill no" id="fill-no" style="width:0"></i>
      </div>
    </div>
    <div id="reset-zone"></div>
  </div>
</footer>

<script>
/* =========================================================
   BAZA PYTAŃ
   id      – unikalny skrót
   q       – treść pytania (może kończyć się „…” albo „to:”)
   correct – poprawna odpowiedź
   wrong   – lista błędnych odpowiedzi (1–3)
   info    – wyjaśnienie pokazywane po odpowiedzi
   tag     – kategoria widoczna na karcie
   wine    – (opcjonalnie) id wina z WINES; nazwa wina pokaże się na górze pytania
   hideWine – true, gdy pytanie to opis wina (nazwa zdradziłaby odpowiedź)
   Kolejność odpowiedzi losuje się sama.
   ========================================================= */

/* ---------- KARTA WIN ----------
   Pola wina (wszystkie opcjonalne poza id i name):
   name, producer, size, grape, region, color, nose, palate, oak, style
   story – lista akapitów {title, text} do opowiedzenia gościowi
   ---------------------------------------------------------------- */
const WINES = [
  {id:"schmitt-ba", name:"Schmitt Söhne Riesling Beerenauslese", size:"0,5 l",
   grape:"Riesling", region:"Rheinhessen, Niemcy", style:"Słodkie, pełne",
   nose:"Mocno intensywny, egzotyczny: owoce tropikalne i miód",
   story:[
     {title:"Beerenauslese", text:"Wino słodkie, produkowane z wyselekcjonowanych, bardzo dojrzałych winogron, często dotkniętych szlachetną pleśnią, która koncentruje ich naturalne cukry."},
     {title:"Rheinhessen", text:"Największy i najstarszy region winiarski Niemiec. Klimat ciepły i suchy, winnice na południowo-zachodnich stokach, gleba z niebieskiego łupka."},
     {title:"Południowo-zachodnie stoki", text:"Na półkuli północnej dają dobre nasłonecznienie, mniejsze ryzyko przymrozków, dobry drenaż i dłuższy okres dojrzewania winogron."}
   ]},
  {id:"balbo-malbec", name:"Balbo Reserva Malbec", producer:"Familia Falasco", size:"0,75 l",
   grape:"Malbec", region:"Mendoza, Argentyna",
   color:"Ciemny rubin z fioletowymi przebłyskami",
   nose:"Intensywny i owocowy: maliny, śliwka, czereśnia, jagody. Najważniejsza jest śliwka",
   palate:"Pełne, gładkie taniny, długi finisz",
   oak:"12 miesięcy: głębia, złożoność, posmak kawy, wanilii i czekolady",
   story:[
     {title:"Mendoza", text:"Największy i najważniejszy region winiarski Argentyny, około 70% krajowej produkcji wina. Leży u podnóża Andów: suchy, słoneczny klimat, duże amplitudy temperatur i wysoko położone winnice. Uprawę w niemal pustynnym środowisku umożliwia nawadnianie wodą z topniejącego śniegu w Andach."},
     {title:"Valle de Uco", text:"Prestiżowy podregion Mendozy z winnicami na wysokości 900–1600 m n.p.m., dużymi amplitudami temperatur i suchym klimatem. Daje wina o intensywnym aromacie, wyraźnej kwasowości, eleganckiej strukturze i dużym potencjale starzenia."}
   ]},
  {id:"rebel-ridge-cab", name:"Rebel Ridge Cabernet Sauvignon", producer:"Rebel Ridge Wines", size:"0,75 l",
   grape:"Cabernet Sauvignon + 15% Petite Sirah", region:"Kalifornia, USA",
   alcohol:"14,5%, czyli dużo jak na wino",
   taste:"Ciemne czerwone owoce, nuty mielonych przypraw, drzewa sandałowego i kakao",
   palate:"Pełna budowa; średnie taniny, drobne i gładkie, bez szorstkości i ściągania; średnia kwasowość",
   oak:"6 miesięcy",
   story:[
     {title:"Petite Sirah", text:"Wzmacnia strukturę, kolor i intensywność wina. Jest go tylko 15%, żeby nie zdominował typowego charakteru Cabernet Sauvignon."},
     {title:"Skąd nazwa", text:"Rebel Ridge zawdzięcza nazwę górskiemu grzbietowi, na którym trzej wizjonerzy postanowili przeciwstawić się dyktatowi wielkich koncernów i zrewolucjonizować rynek wina."},
     {title:"Winiarz", text:"Główny winiarz ma włoskie korzenie w Valpolicelli. Wykorzystał kalifornijskie terroir, by stworzyć wino zrywające ze sztywnymi normami."}
   ]},
  {id:"in-situ-blend", name:"In Situ Signature Wines Full Bodied Blend", producer:"Viña San Esteban", size:"0,75 l",
   grape:"Cabernet Sauvignon, Petit Verdot, Carménère", region:"Dolina Aconcagua, Chile · zbocza Paidahuén · DO Valle de Aconcagua",
   alcohol:"14,5%",
   nose:"Czerwona porzeczka, dojrzałe wiśnie, czarny pieprz i mineralny akcent mokrego kamienia",
   palate:"Pełne, o gładkiej konsystencji, z długim finiszem; średnia kwasowość i średnie taniny",
   oak:"12 miesięcy w dębie francuskim (zaokrągla taniny) + 6 miesięcy dojrzewania w butelce",
   story:[
     {title:"Skąd mineralność", text:"Z kamienistych gleb na zboczach Paidahuén."},
     {title:"Dolina Aconcagua", text:"Ważny region winiarski Chile, na północ od Santiago, między Andami a wybrzeżem Pacyfiku. Suchy, ciepły klimat śródziemnomorski; chłodne wiatry oceaniczne w zachodniej części pomagają zachować świeżość win."},
     {title:"Paidahuén – do zapamiętania", text:"Winnice sięgają ok. 940 m n.p.m. Ciepłe dni i chłodne noce dają dojrzałe taniny przy zachowaniu aromatyczności. To przykład chilijskiego wina wysokogórskiego: skoncentrowany owoc, struktura i taniny, ale też świeżość. Czerwone wina z tego obszaru wyróżniają się koncentracją owocu, wyraźną strukturą tanin i mineralnym charakterem."}
   ]},
  {id:"boland-pinotage", name:"Boland Cellar Ahintof Coffee Pinotage", producer:"Boland Cellar", 
   grape:"Pinotage (krzyżówka Pinot Noir i Cinsault)", region:"Paarl, RPA",
   alcohol:"ok. 14%", style:"Skoncentrowane, z kremowym wykończeniem",
   nose:"Ciemne śliwki, dojrzałe i ciemne owoce, kawa, mokka, cedr i nuty francuskiego dębu",
   oak:"3 miesiące",

/* pytania „Które to wino?” – odpowiedzi to nazwy win z karty */
QUESTIONS.forEach(q=>{
  if(!q.ident) return;
  const w = WINES.find(x=>x.id===q.wine);
  q.hideWine = true; q.correct = w.name;
  q.wrong = WINES.filter(x=>x.id!==w.id).map(x=>x.name).sort(()=>Math.random()-.5).slice(0,3);
});
/* ---------- storage ---------- */
const LS = "slonce-quiz-v2";
function load(){
  try{ const s = JSON.parse(localStorage.getItem(LS)); if(s && typeof s==="object") return s; }catch(e){}
  return {};
}
let store = Object.assign({hard:[], stats:{}, run:null}, load());
function save(){ try{ localStorage.setItem(LS, JSON.stringify(store)); }catch(e){} }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const byId = id => QUESTIONS.find(q=>q.id===id);
const isHard = id => store.hard.includes(id);
const wineById = id => WINES.find(w=>w.id===id);
function wineCard(id){
  const w = id && wineById(id); if(!w) return "";
  const row = (k,v) => v ? `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>` : "";
  const story = (w.story||[]).map(s=>`<div class="story"><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join("");
  return `<div class="wine-card">
    <div class="wc-head">
      <p class="wine-name">${esc(w.name)}</p>
      <p class="wine-by">${[w.producer, w.region].filter(Boolean).map(esc).join(" · ")}</p>
    </div>
    <dl class="facts">${row("Szczep",w.grape)}${row("Styl",w.style)}${row("Alkohol",w.alcohol)}${row("Kolor",w.color)}${row("Zapach",w.nose)}${row("Smak",w.taste)}${row("W ustach",w.palate)}${row("Winifikacja",w.making)}${row("Beczka",w.oak)}${row("Podawanie",w.serve)}${row("Do jedzenia",w.pairing)}</dl>
    ${story?`<div class="stories">${story}</div>`:""}
  </div>`;
}
const hardIds = () => store.hard.filter(byId);

/* ---------- kategorie win (do ekranu wyboru) ---------- */
function wineCat(w){
  const s = (w.style||"").toLowerCase(), r = w.region||"";
  if(s.includes("musując")) return "Musujące";
  if(s.includes("różowe")) return "Różowe";
  if(s.startsWith("słodkie")) return "Słodkie";
  if(/Włoch/.test(r)) return "Czerwone · Włochy";
  if(/Franc/.test(r)) return "Czerwone · Francja";
  if(/Hiszpan/.test(r)) return "Czerwone · Hiszpania";
  if(/Polsk/.test(r)) return "Czerwone · Polska";
  return "Czerwone · Nowy Świat";
}
const CATS = ["Musujące","Różowe","Czerwone · Włochy","Czerwone · Francja","Czerwone · Hiszpania","Czerwone · Polska","Czerwone · Nowy Świat","Słodkie"];
const qCountFor = wid => QUESTIONS.filter(q=>q.wine===wid).length;

/* ---------- przebieg (zapisany w localStorage, przetrwa odświeżenie) ---------- */
/* pytania „Jak opiszesz gościowi…” idą na początek quizu */
const isFirst = q => /^Jak opiszesz gościowi/.test(q.q);
function idsFor(cfg){
  if(cfg.mode==="hard") return hardIds();
  if(cfg.mode==="wines") return QUESTIONS.filter(q=>cfg.wines.includes(q.wine)).map(q=>q.id);
  return QUESTIONS.map(q=>q.id);
}
function runLabel(cfg){
  if(cfg.mode==="hard") return "Trudne pytania";
  if(cfg.mode==="wines") return cfg.wines.length===1 ? (wineById(cfg.wines[0])||{}).name || "Wybrane wino" : `Wybrane wina (${cfg.wines.length})`;
  return "Wszystkie wina";
}
function newRun(cfg){
  cfg = {mode:cfg.mode, wines:(cfg.wines||[]).filter(wineById)};
  const ids = idsFor(cfg);
  if(!ids.length){ store.run = null; save(); return false; }
  const order = [...shuffle(ids.filter(id=>isFirst(byId(id)))), ...shuffle(ids.filter(id=>!isFirst(byId(id))))];
  const opts = {};
  order.forEach(id=>{ const q=byId(id); opts[id]=shuffle([q.correct, ...q.wrong]); });
  store.run = {...cfg, order, opts, idx:0, answers:{}};
  save();
  return true;
}
function validRun(){
  const r = store.run;
  return r && Array.isArray(r.order) && r.order.length && r.order.every(byId) && r.opts && r.answers;
}
const runCfg = () => store.run ? {mode:store.run.mode==="all"||store.run.mode==="hard"||store.run.mode==="wines"?store.run.mode:"all", wines:store.run.wines||[]} : {mode:"all", wines:[]};
const inProgress = () => validRun() && store.run.idx>0 && store.run.idx<store.run.order.length;

let view = "home";

function render(){
  updateBottom();
  $("#hard-count").textContent = hardIds().length;
  setPressed(view);
  $("#m-quiz").disabled = !validRun();
  if(view==="list") return renderList();
  if(view==="home" || !validRun()) { view="home"; setPressed("home"); return renderHome(); }
  const r = store.run;
  if(r.idx >= r.order.length) return renderEnd();
  renderQuestion();
}

function startRun(cfg){
  if(!newRun(cfg)) return;
  view = "quiz"; render(); window.scrollTo({top:0});
}

/* ---------- ekran startowy ---------- */

  const pick = (store.pick||[]).filter(wineById);

  $("#app").innerHTML = `
    ${inProgress()?`
    <section class="card resume">
      <div><small>Masz rozpoczęty quiz</small><b>${esc(runLabel(r))}</b><span>Pytanie ${r.idx+1} z ${r.order.length}</span></div>
      <button class="btn primary" id="resume">Kontynuuj →</button>

    <section class="card">

        </div>
      </div>
      ${groups.map(g=>`

          <div class="pg-head"><h3>${g.c}</h3><button class="link-btn" data-group="${g.c}">zaznacz grupę</button></div>

            ${g.wines.map(w=>`

                  <span class="pk-txt"><b>${esc(w.name)}</b><small>${esc(w.region||"")} · ${qCountFor(w.id)} pytań</small></span>

                <button class="only" data-only="${w.id}" title="Ucz się tylko tego wina">Tylko to</button>
              </li>`).join("")}
          </ul>
        </div>`).join("")}
      <div class="pick-go">
        <span id="pick-sum">${pick.length?`${pick.length} win · ${pickQ} pytań`:"Nic nie zaznaczono"}</span>
        <button class="btn primary" id="start-pick" ${pick.length?"":"disabled"}>Start z wybranymi →</button>
      </div>
    </section>`;

  const rs = $("#resume"); if(rs) rs.addEventListener("click",()=>{ view="quiz"; render(); window.scrollTo({top:0}); });
  $("#start-all").addEventListener("click",()=>startRun({mode:"all"}));
  $("#start-hard").addEventListener("click",()=>startRun({mode:"hard"}));
  $("#jump-pick").addEventListener("click",e=>{ e.preventDefault(); $("#wybor").scrollIntoView({behavior:"smooth",block:"start"}); });
  const setPick = ids => { store.pick = ids; save(); renderHome(); };
  document.querySelectorAll("[data-wine]").forEach(cb=>cb.addEventListener("change",()=>{
    const ids = [...document.querySelectorAll("[data-wine]:checked")].map(x=>x.dataset.wine);

  $("#pick-none").addEventListener("click",()=>setPick([]));

function renderQuestion(){
  const r = store.run, id = r.order[r.idx], q = byId(id), opts = r.opts[id];
  const long = opts.some(o=>o.length>60);
  const picked = r.answers[id];
  const w = q.wine && !q.hideWine ? wineById(q.wine) : null;
  $("#app").innerHTML = `
    <section class="card">
      ${w?`<div class="wine-top"><small>Wino</small><b>${esc(w.name)}</b>${w.producer?`<span>${esc(w.producer)}</span>`:""}</div>`:""}
      <div class="meta"><span>${esc(runLabel(r))}</span><span class="chip">${esc(q.tag||"Pytanie")}</span></div>
      <h1 class="q">${esc(q.q)}</h1>
      <div class="opts ${long?"long":""}">
        ${opts.map((o,i)=>`<button class="opt" id="opt-${i}" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${esc(o)}</span></button>`).join("")}
      </div>
      ${picked===undefined?`<p class="wait">Wybierz odpowiedź, aby przejść dalej · klawisze 1–4</p>`:""}
      <div class="actions q-actions" id="q-actions"></div>
    </section>
    <div id="fb-slot"></div>`;
  document.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.i)));
  if(picked!==undefined) showResult(picked, false);
}

function answer(i){
  const r = store.run, id = r.order[r.idx];
  if(r.answers[id]!==undefined) return;
  const ok = r.opts[id][i]===byId(id).correct;
  r.answers[id] = i;
  const st = store.stats[id] || {seen:0, ok:0}; st.seen++; if(ok) st.ok++; store.stats[id] = st;
  save();
  updateBottom();
  const w = $(".wait"); if(w) w.remove();
  showResult(i, true);
}

function showResult(i, scroll){
  const r = store.run, id = r.order[r.idx], q = byId(id), opts = r.opts[id];
  const ok = opts[i]===q.correct;
  document.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    if(opts[j]===q.correct) b.classList.add("right");
    else if(j===i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  const last = r.idx+1 >= r.order.length;
  $("#fb-slot").innerHTML = `
    <section class="fb ${ok?"ok":"no"}" id="fb">
      <div class="fb-head"><strong>${ok?"Dobrze!":"Niestety nie"}</strong></div>
      <div class="fb-body">
        ${ok?"":`<p class="answer-line"><small>Poprawna odpowiedź</small>${esc(q.correct)}</p>`}
        <p class="info">${esc(q.info)}</p>
        ${wineCard(q.wine)}
      </div>
    </section>`;
  $("#q-actions").innerHTML = `
    <button class="btn small ${isHard(id)?"on":""}" id="hard-btn">${hardLabel(id)}</button>
    <button class="btn primary" id="next-btn">${last?"Zobacz wynik":"Dalej →"}</button>`;
  $("#hard-btn").addEventListener("click",()=>toggleHard(id));
  $("#next-btn").addEventListener("click", goNext);
  if(scroll){
    $("#next-btn").focus({preventScroll:true});
    $("#q-actions").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"nearest"});
  }
}

function goNext(){
  const r = store.run, id = r.order[r.idx];
  if(r.answers[id]===undefined) return;   // bez odpowiedzi nie ma przejścia dalej
  r.idx++; save(); render(); window.scrollTo({top:0});
}

const hardLabel = id => isHard(id) ? "★ Zapisane jako trudne" : "☆ Zapisz jako trudne";
function toggleHard(id){
  store.hard = isHard(id) ? store.hard.filter(x=>x!==id) : [...store.hard, id];
  save();
  $("#hard-count").textContent = hardIds().length;
  const b = $("#hard-btn"); if(b){ b.textContent = hardLabel(id); b.classList.toggle("on", isHard(id)); }
}

function counts(){
  const r = store.run; if(!validRun()) return {total:0, done:0, ok:0};
  let ok = 0, done = 0;
  r.order.forEach(id=>{ const a = r.answers[id]; if(a!==undefined){ done++; if(r.opts[id][a]===byId(id).correct) ok++; } });
  return {total:r.order.length, done, ok};
}

function renderEnd(){
  const {total, ok} = counts(), pct = total ? Math.round(ok/total*100) : 0;
  const msg = pct===100 ? "Komplet. Wszystko się zgadza." : pct>=70 ? "Bardzo dobrze. Powtórz trudne pytania i będzie komplet." : "Przejdź jeszcze raz albo poćwicz tylko trudne pytania.";
  const h = hardIds().length;
  $("#app").innerHTML = `
    <section class="card">
      <div class="meta"><span>${esc(runLabel(store.run))}</span><span class="chip">${pct}%</span></div>
      <p class="big">${ok}/${total}</p>
      <p class="lead">${msg}</p>
      <div class="actions" style="justify-content:flex-start">
        <button class="btn primary" id="again">Jeszcze raz</button>
        <button class="btn" id="go-home">Wybierz inny zakres</button>
        ${h && store.run.mode!=="hard"?`<button class="btn" id="go-hard">Ćwicz trudne (${h})</button>`:""}
      </div>
    </section>`;
  $("#again").addEventListener("click",()=>startRun(runCfg()));
  $("#go-home").addEventListener("click",()=>{ view="home"; render(); window.scrollTo({top:0}); });
  const gh = $("#go-hard"); if(gh) gh.addEventListener("click",()=>startRun({mode:"hard"}));
}

function renderList(){
  const items = hardIds().map(byId);
  $("#app").innerHTML = `
    <section class="card">
      <div class="meta"><span>Lista trudnych</span><span class="chip">${items.length}</span></div>
      <h1 class="q">Pytania do powtórki</h1>
      ${items.length ? `<ul class="list">${items.map(q=>{
          const st = store.stats[q.id];
          const wn = q.wine && wineById(q.wine);
          return `<li><div><small>${wn?esc(wn.name)+" · ":""}${esc(q.tag||"Pytanie")}${st?` · ${st.ok}/${st.seen} dobrze`:""}</small>${esc(q.q)}</div>
            <button class="btn small" data-rm="${esc(q.id)}">Usuń</button></li>`;}).join("")}</ul>
          <div class="actions" style="margin-top:18px;justify-content:flex-start"><button class="btn primary" id="go-hard">Ćwicz trudne</button></div>`
        : `<p class="empty">Pusto. Zapisuj pytania podczas quizu przyciskiem „☆ Zapisz jako trudne”.</p>`}
    </section>`;
  document.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{
    store.hard = store.hard.filter(x=>x!==b.dataset.rm); save(); render();
  }));
  const gh = $("#go-hard"); if(gh) gh.addEventListener("click",()=>startRun({mode:"hard"}));
}

function setPressed(v){ document.querySelectorAll(".mode").forEach(b=>b.setAttribute("aria-pressed", b.dataset.view===v)); }
document.querySelectorAll(".mode").forEach(b=>b.addEventListener("click",()=>{
  view = b.dataset.view; render(); window.scrollTo({top:0});
}));

/* ---------- dolny pasek ---------- */
function updateBottom(){
  const {total, done, ok} = counts();
  const r = store.run;
  const cur = total ? Math.min(r.idx+1, total) : 0;
  $("#pos").textContent = total ? (r.idx>=total ? `Koniec · ${total} / ${total}` : `Pytanie ${cur} / ${total}`) : "Wybierz zakres";
  $("#score").textContent = `${ok} / ${done}`;
  $("#fill-ok").style.width = total ? (ok/total*100)+"%" : "0";
  $("#fill-no").style.width = total ? ((done-ok)/total*100)+"%" : "0";
  $("#track").setAttribute("aria-valuenow", total ? Math.round(done/total*100) : 0);
}

function resetIdle(){
  $("#reset-zone").innerHTML = `<button class="reset" id="reset-btn">RESET</button>`;
  $("#reset-btn").addEventListener("click", resetAsk);
}
function resetAsk(){
  $("#reset-zone").innerHTML = `<div class="confirm"><span>Zacząć od nowa?</span>
    <button class="reset" id="reset-yes">TAK</button><button class="reset ghost" id="reset-no">NIE</button></div>`;
  $("#reset-yes").addEventListener("click",()=>{
    resetIdle();
    if(validRun()) startRun(runCfg()); else { view="home"; render(); }
  });
  $("#reset-no").addEventListener("click", resetIdle);
}

/* ---------- klawiatura ---------- */
document.addEventListener("keydown",e=>{
  if(view!=="quiz" || !validRun()) return;
  const r = store.run, id = r.order[r.idx]; if(!id) return;
  const map = {"1":0,"2":1,"3":2,"4":3};
  if(e.key in map && r.answers[id]===undefined && document.getElementById("opt-"+map[e.key])){ answer(map[e.key]); e.preventDefault(); }
  else if(e.key==="Enter" && r.answers[id]!==undefined && document.activeElement?.id!=="next-btn"){ goNext(); e.preventDefault(); }
});

/* start — gdy baza pytań się zmieni, podejście startuje od nowa z tym samym zakresem */
const SIG = QUESTIONS.map(q=>q.id).join("|");
if(store.sig!==SIG){ store.sig = SIG; if(store.run) newRun(runCfg()); }
if(!validRun()) store.run = null;
view = inProgress() ? "quiz" : "home";
resetIdle();
render();
</script>

</body></html>
